name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect the release notes
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?sm)^## $([regex]::Escape($version))\r?\n(.*?)(?=^## |\z)"
          $notes = if ($changelog -match $pattern) { $Matches[1].Trim() } else { "See CHANGELOG.md for the changes in this version." }
          "RELEASE_NOTES<<LIBRECUT_EOF`n$notes`nLIBRECUT_EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache FFmpeg sidecars
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/legal/FFMPEG-BUILD-INFO.txt
            src-tauri/legal/FFMPEG-BUILD-LICENSE.txt
          key: ffmpeg-9.0.1-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}
      - name: Fetch FFmpeg sidecars
        run: ./scripts/fetch-ffmpeg.ps1
        shell: pwsh
      - name: Check the bundled FFmpeg
        run: ./src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -version
        shell: pwsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build, sign, and publish updater release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: LibreCut v__VERSION__
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi

  macos-dmg:
    needs: windows-installer
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect the release notes
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?sm)^## $([regex]::Escape($version))\r?\n(.*?)(?=^## |\z)"
          $notes = if ($changelog -match $pattern) { $Matches[1].Trim() } else { "See CHANGELOG.md for the changes in this version." }
          "RELEASE_NOTES<<LIBRECUT_EOF`n$notes`nLIBRECUT_EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bash ./scripts/fetch-ffmpeg-unix.sh
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: LibreCut v__VERSION__
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: false
          args: --bundles app,dmg

  linux-packages:
    needs: macos-dmg
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect the release notes
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?sm)^## $([regex]::Escape($version))\r?\n(.*?)(?=^## |\z)"
          $notes = if ($changelog -match $pattern) { $Matches[1].Trim() } else { "See CHANGELOG.md for the changes in this version." }
          "RELEASE_NOTES<<LIBRECUT_EOF`n$notes`nLIBRECUT_EOF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: bash ./scripts/fetch-ffmpeg-unix.sh
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: LibreCut v__VERSION__
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: true
          prerelease: false
          args: --bundles deb,appimage
