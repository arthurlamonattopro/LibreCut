name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Cache FFmpeg sidecars
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/binaries
            src-tauri/legal/FFMPEG-BUILD-INFO.txt
            src-tauri/legal/FFMPEG-BUILD-LICENSE.txt
          key: ffmpeg-essentials-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}
      - name: Fetch FFmpeg sidecars
        run: ./scripts/fetch-ffmpeg.ps1
        shell: pwsh
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
        env:
          LIBRECUT_REQUIRE_FFMPEG: "1"

  unix-desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            bundles: app,dmg
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Fetch platform FFmpeg sidecars
        run: bash ./scripts/fetch-ffmpeg-unix.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}