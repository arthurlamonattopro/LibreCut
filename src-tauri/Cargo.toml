[package]
name = "librecut"
version = "0.3.0"
description = "LibreCut desktop application"
authors = ["LibreCut contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-only"

[lib]
name = "librecut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
percent-encoding = "2"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "=2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
